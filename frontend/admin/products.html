<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products — Admin · Bencodez-Ventures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <style>
      .product-thumb {
        width: 44px;
        height: 44px;
        background: var(--gray-100);
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        overflow: hidden;
      }
      .product-cell {
        display: flex;
        align-items: center;
        gap: var(--s-3);
      }
      .product-cell strong {
        display: block;
        color: var(--navy);
      }
      .product-cell span {
        font-size: var(--fs-xs);
        color: var(--gray-500);
      }

      .action-btns {
        display: flex;
        gap: var(--s-2);
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        border-radius: var(--radius);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: var(--fs-sm);
        transition: all var(--transition);
        cursor: pointer;
      }
      .icon-btn.edit {
        background: #dbeafe;
        color: #1e40af;
      }
      .icon-btn.edit:hover {
        background: #1e40af;
        color: white;
      }
      .icon-btn.toggle {
        background: #fef3c7;
        color: #b45309;
      }
      .icon-btn.toggle:hover {
        background: #b45309;
        color: white;
      }
      .icon-btn.delete {
        background: #fee2e2;
        color: #dc2626;
      }
      .icon-btn.delete:hover {
        background: #dc2626;
        color: white;
      }

      .filter-bar {
        display: flex;
        gap: var(--s-3);
        margin-bottom: var(--s-6);
        flex-wrap: wrap;
        align-items: center;
      }
      .filter-bar input,
      .filter-bar select {
        padding: var(--s-2) var(--s-4);
        border: 2px solid var(--gray-300);
        border-radius: var(--radius);
        font-size: var(--fs-sm);
        background: white;
      }
      .filter-bar input {
        flex: 1;
        min-width: 200px;
      }

      .status-pill {
        display: inline-block;
        padding: 2px 10px;
        border-radius: var(--radius-full);
        font-size: var(--fs-xs);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .status-pill.active {
        background: #dcfce7;
        color: #16a34a;
      }
      .status-pill.inactive {
        background: #fee2e2;
        color: #dc2626;
      }
      .status-pill.out {
        background: #fef3c7;
        color: #b45309;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--s-4);
      }
      @media (max-width: 600px) {
        .form-row {
          grid-template-columns: 1fr;
        }
      }

      .image-upload-row {
        display: flex;
        gap: var(--s-4);
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .image-preview {
        width: 100px;
        height: 100px;
        background: var(--gray-100);
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        flex-shrink: 0;
        overflow: hidden;
        border: 2px solid var(--gray-100);
      }
      .image-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
    <link rel="stylesheet" href="../css/mobile.css" />
  </head>
  <body class="admin-body">
    <aside class="admin-sidebar">
      <div class="admin-logo">
        <a href="../index.html" class="logo">Bencodez<span>.</span></a>
        <span class="admin-tag">Admin</span>
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html"><span>📊</span> Dashboard</a>
        <a href="products.html" class="active"><span>📦</span> Products</a>
        <a href="orders.html"><span>🛒</span> Orders</a>
        <a href="users.html"><span>👥</span> Users</a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="../index.html"><span>🏠</span> Back to Store</a>
        <a href="#" onclick="logout()"><span>🚪</span> Logout</a>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Products</h1>
          <p>Manage your store's inventory.</p>
        </div>
        <button class="btn btn-accent" onclick="openAddModal()">
          ➕ Add Product
        </button>
      </div>

      <div class="filter-bar">
        <input type="text" id="search-input" placeholder="Search products..." />
        <select id="category-filter">
          <option value="">All Categories</option>
          <option value="clothes">Clothes</option>
          <option value="gadgets">Gadgets</option>
          <option value="cosmetics">Cosmetics</option>
          <option value="deodorants">Deodorants</option>
          <option value="jewellery">Jewellery</option>
        </select>
        <select id="status-filter">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
          <option value="out">Out of Stock</option>
        </select>
      </div>

      <div class="admin-panel">
        <div id="products-table-container"></div>
      </div>
    </main>

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <h2 id="modal-title">Add Product</h2>
        <form id="product-form">
          <div class="form-group">
            <label>Product Name *</label>
            <input
              type="text"
              class="form-control"
              id="form-name"
              required
              maxlength="100"
            />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Price (₦) *</label>
              <input
                type="number"
                class="form-control"
                id="form-price"
                required
                min="0"
                step="1"
              />
            </div>
            <div class="form-group">
              <label>Stock *</label>
              <input
                type="number"
                class="form-control"
                id="form-stock"
                required
                min="0"
                step="1"
              />
            </div>
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select class="form-control" id="form-category" required>
              <option value="">Select category</option>
              <option value="clothes">Clothes</option>
              <option value="gadgets">Gadgets</option>
              <option value="cosmetics">Cosmetics</option>
              <option value="deodorants">Deodorants</option>
              <option value="jewellery">Jewellery</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea
              class="form-control"
              id="form-description"
              rows="3"
              maxlength="500"
              placeholder="Short description shown to customers"
            ></textarea>
          </div>

          <div class="form-group">
            <label>Product Image</label>
            <div class="image-upload-row">
              <div class="image-preview" id="image-preview">📦</div>
              <div style="flex: 1; min-width: 200px">
                <input
                  type="file"
                  id="form-image-file"
                  accept="image/*"
                  style="display: none"
                />
                <input type="hidden" id="form-image" value="" />
                <button
                  type="button"
                  class="btn btn-ghost btn-sm"
                  onclick="document.getElementById('form-image-file').click()"
                >
                  📁 Choose Image
                </button>
                <button
                  type="button"
                  class="btn btn-ghost btn-sm"
                  onclick="removeImage()"
                  id="remove-image-btn"
                  style="display: none"
                >
                  🗑️ Remove
                </button>
                <p
                  style="
                    font-size: var(--fs-xs);
                    color: var(--gray-500);
                    margin-top: var(--s-2);
                  "
                >
                  JPEG, PNG, WEBP, or GIF · Max 5 MB
                </p>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>
              <input type="checkbox" id="form-active" checked />
              Active (visible to customers)
            </label>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" onclick="closeModal()">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary" id="save-btn">
              Save Product
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast" id="toast">Saved!</div>

    <!-- ✅ FIXED: ../js/config.js -->
    <script src="../js/config.js"></script>

    <script>
      const token = localStorage.getItem("token");
      const userStr = localStorage.getItem("user");

      if (!token || !userStr) window.location.href = "../login.html";
      const user = JSON.parse(userStr);
      if (!user.isAdmin) {
        alert("Access denied. Admin only.");
        window.location.href = "../index.html";
      }

      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "../index.html";
      }

      function showToast(message, type = "success") {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.className = `toast show ${type}`;
        setTimeout(() => toast.classList.remove("show"), 2500);
      }

      async function apiFetch(path, options = {}) {
        const res = await fetch(`${API}${path}`, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
            ...(options.headers || {}),
          },
        });
        const data = res.status === 204 ? null : await res.json();
        if (!res.ok)
          throw new Error(
            (data && data.error) || `Request failed: ${res.status}`,
          );
        return data;
      }

      function setImagePreview(url) {
        const preview = document.getElementById("image-preview");
        const removeBtn = document.getElementById("remove-image-btn");
        if (url) {
          preview.innerHTML = `<img src="${url}" alt="Preview">`;
          removeBtn.style.display = "inline-flex";
        } else {
          preview.innerHTML = "📦";
          removeBtn.style.display = "none";
        }
      }

      function removeImage() {
        document.getElementById("form-image").value = "";
        document.getElementById("form-image-file").value = "";
        setImagePreview("");
      }

      document
        .getElementById("form-image-file")
        .addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (ev) => setImagePreview(ev.target.result);
          reader.readAsDataURL(file);

          const formData = new FormData();
          formData.append("image", file);

          try {
            const res = await fetch(`${API}/products/upload`, {
              method: "POST",
              headers: { Authorization: `Bearer ${token}` },
              body: formData,
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Upload failed");

            document.getElementById("form-image").value = data.url;
            setImagePreview(data.url);
            showToast("Image uploaded ✅");
          } catch (error) {
            console.error(error);
            showToast(error.message, "error");
            removeImage();
          }
        });

      let products = [];
      let editingId = null;
      let currentSearch = "";
      let currentCategory = "";
      let currentStatus = "";

      async function loadProducts() {
        try {
          products = await apiFetch("/products/admin/all");
          renderTable();
        } catch (error) {
          console.error(error);
          showToast(error.message, "error");
        }
      }

      function renderTable() {
        const container = document.getElementById("products-table-container");
        let filtered = [...products];

        if (currentSearch) {
          filtered = filtered.filter((p) =>
            p.name.toLowerCase().includes(currentSearch.toLowerCase()),
          );
        }
        if (currentCategory) {
          filtered = filtered.filter((p) => p.category === currentCategory);
        }
        if (currentStatus === "active")
          filtered = filtered.filter((p) => p.is_active && p.stock > 0);
        if (currentStatus === "inactive")
          filtered = filtered.filter((p) => !p.is_active);
        if (currentStatus === "out")
          filtered = filtered.filter((p) => p.stock === 0);

        if (filtered.length === 0) {
          container.innerHTML = `<div class="empty-state-sm">No products match your filters.</div>`;
          return;
        }

        container.innerHTML = `
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtered
                          .map(
                            (p) => `
                            <tr>
                                <td>
                                    <div class="product-cell">
                                        <div class="product-thumb">
                                            ${
                                              p.image_url
                                                ? `<img src="${p.image_url}" alt="${p.name}" style="width:100%; height:100%; object-fit:cover;">`
                                                : "📦"
                                            }
                                        </div>
                                        <div>
                                            <strong>${p.name}</strong>
                                            <span>#${p.id}</span>
                                        </div>
                                    </div>
                                </td>
                                <td style="text-transform: capitalize;">${p.category}</td>
                                <td><strong>₦${Number(p.price).toLocaleString()}</strong></td>
                                <td>${p.stock}</td>
                                <td>${statusPill(p)}</td>
                                <td>
                                    <div class="action-btns">
                                        <button class="icon-btn edit" title="Edit" onclick="openEditModal(${p.id})">✏️</button>
                                        <button class="icon-btn toggle" title="${p.is_active ? "Deactivate" : "Activate"}" onclick="toggleActive(${p.id})">${p.is_active ? "🚫" : "✅"}</button>
                                        <button class="icon-btn delete" title="Delete" onclick="deleteProduct(${p.id})">🗑️</button>
                                    </div>
                                </td>
                            </tr>
                        `,
                          )
                          .join("")}
                    </tbody>
                </table>
            `;
      }

      function statusPill(p) {
        if (!p.is_active)
          return `<span class="status-pill inactive">Inactive</span>`;
        if (p.stock === 0)
          return `<span class="status-pill out">Out of Stock</span>`;
        return `<span class="status-pill active">Active</span>`;
      }

      function openAddModal() {
        editingId = null;
        document.getElementById("modal-title").textContent = "Add Product";
        document.getElementById("product-form").reset();
        document.getElementById("form-active").checked = true;
        removeImage();
        document.getElementById("modal-overlay").classList.add("active");
      }

      function openEditModal(id) {
        const product = products.find((p) => p.id === id);
        if (!product) return;
        editingId = id;
        document.getElementById("modal-title").textContent = "Edit Product";
        document.getElementById("form-name").value = product.name;
        document.getElementById("form-price").value = product.price;
        document.getElementById("form-stock").value = product.stock;
        document.getElementById("form-category").value = product.category;
        document.getElementById("form-description").value =
          product.description || "";
        document.getElementById("form-image").value = product.image_url || "";
        document.getElementById("form-active").checked = product.is_active;
        setImagePreview(product.image_url || "");
        document.getElementById("modal-overlay").classList.add("active");
      }

      function closeModal() {
        document.getElementById("modal-overlay").classList.remove("active");
      }

      document
        .getElementById("product-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const data = {
            name: document.getElementById("form-name").value.trim(),
            price: parseFloat(document.getElementById("form-price").value),
            stock: parseInt(document.getElementById("form-stock").value),
            category: document.getElementById("form-category").value,
            description:
              document.getElementById("form-description").value.trim() || null,
            imageUrl:
              document.getElementById("form-image").value.trim() || null,
            isActive: document.getElementById("form-active").checked,
          };

          try {
            if (editingId) {
              await apiFetch(`/products/${editingId}`, {
                method: "PUT",
                body: JSON.stringify(data),
              });
              showToast("Product updated");
            } else {
              const { isActive, ...createData } = data;
              await apiFetch("/products", {
                method: "POST",
                body: JSON.stringify(createData),
              });
              showToast("Product added");
            }
            closeModal();
            await loadProducts();
          } catch (error) {
            console.error(error);
            showToast(error.message, "error");
          }
        });

      async function toggleActive(id) {
        try {
          await apiFetch(`/products/${id}/toggle`, { method: "PATCH" });
          showToast("Product status changed");
          await loadProducts();
        } catch (error) {
          showToast(error.message, "error");
        }
      }

      async function deleteProduct(id) {
        const product = products.find((p) => p.id === id);
        if (!product) return;
        if (!confirm(`Delete "${product.name}"? This cannot be undone.`))
          return;
        try {
          await apiFetch(`/products/${id}`, { method: "DELETE" });
          showToast("Product deleted");
          await loadProducts();
        } catch (error) {
          showToast(error.message, "error");
        }
      }

      document.getElementById("search-input").addEventListener("input", (e) => {
        currentSearch = e.target.value;
        renderTable();
      });
      document
        .getElementById("category-filter")
        .addEventListener("change", (e) => {
          currentCategory = e.target.value;
          renderTable();
        });
      document
        .getElementById("status-filter")
        .addEventListener("change", (e) => {
          currentStatus = e.target.value;
          renderTable();
        });

      document
        .getElementById("modal-overlay")
        .addEventListener("click", (e) => {
          if (e.target.id === "modal-overlay") closeModal();
        });

      loadProducts();
    </script>
  </body>
</html>
