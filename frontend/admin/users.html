<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users — Admin · Bencodez-Ventures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <style>
      .user-cell {
        display: flex;
        align-items: center;
        gap: var(--s-3);
      }
      .user-avatar-sm {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--navy);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: var(--fs-base);
        flex-shrink: 0;
      }
      .user-avatar-sm.admin {
        background: var(--gold);
        color: var(--navy);
      }
      .user-cell strong {
        display: block;
        color: var(--navy);
      }
      .user-cell span {
        font-size: var(--fs-xs);
        color: var(--gray-500);
      }

      .role-pill {
        display: inline-block;
        padding: 2px 10px;
        border-radius: var(--radius-full);
        font-size: var(--fs-xs);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .role-pill.admin {
        background: var(--gold);
        color: var(--navy);
      }
      .role-pill.customer {
        background: var(--gray-100);
        color: var(--gray-700);
      }

      .role-tabs {
        display: flex;
        gap: var(--s-2);
        margin-bottom: var(--s-6);
      }
      .role-tab {
        padding: var(--s-2) var(--s-4);
        border-radius: var(--radius-full);
        font-size: var(--fs-sm);
        font-weight: 600;
        background: white;
        color: var(--gray-700);
        border: 2px solid var(--gray-100);
        transition: all var(--transition);
      }
      .role-tab:hover {
        border-color: var(--navy);
      }
      .role-tab.active {
        background: var(--navy);
        color: white;
        border-color: var(--navy);
      }
      .role-tab .count {
        display: inline-block;
        background: rgba(255, 255, 255, 0.2);
        padding: 1px 8px;
        border-radius: var(--radius-full);
        margin-left: var(--s-2);
        font-size: var(--fs-xs);
      }
      .role-tab:not(.active) .count {
        background: var(--gray-100);
        color: var(--gray-700);
      }

      /* User details modal */
      .user-profile-header {
        display: flex;
        align-items: center;
        gap: var(--s-4);
        margin-bottom: var(--s-6);
        padding-bottom: var(--s-4);
        border-bottom: 1px solid var(--gray-100);
      }
      .user-avatar-lg {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--navy);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--fs-3xl);
        font-weight: 800;
        flex-shrink: 0;
      }
      .user-avatar-lg.admin {
        background: var(--gold);
        color: var(--navy);
      }
      .user-profile-header h2 {
        font-size: var(--fs-xl);
        margin-bottom: var(--s-1);
      }
      .user-profile-header p {
        font-size: var(--fs-sm);
        color: var(--gray-500);
      }
      .stat-mini-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--s-3);
        margin-bottom: var(--s-6);
      }
      .stat-mini {
        background: var(--gray-100);
        border-radius: var(--radius);
        padding: var(--s-4);
      }
      .stat-mini .label {
        font-size: var(--fs-xs);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--gray-500);
        font-weight: 600;
        margin-bottom: var(--s-1);
      }
      .stat-mini .value {
        font-size: var(--fs-xl);
        font-weight: 800;
        color: var(--navy);
      }

      .user-orders-mini {
        border: 1px solid var(--gray-100);
        border-radius: var(--radius);
        overflow: hidden;
        margin-bottom: var(--s-4);
      }
      .user-orders-mini .mini-order {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--s-3) var(--s-4);
        border-bottom: 1px solid var(--gray-100);
        font-size: var(--fs-sm);
      }
      .user-orders-mini .mini-order:last-child {
        border-bottom: none;
      }
      .mini-order-id {
        font-weight: 700;
        color: var(--navy);
      }
      .mini-order-total {
        font-weight: 700;
        color: var(--navy);
      }
    </style>
    <link rel="stylesheet" href="../css/mobile.css" />
  </head>
  <body class="admin-body">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="admin-logo">
        <a href="../index.html" class="logo">Bencodez<span>.</span></a>
        <span class="admin-tag">Admin</span>
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html"><span>📊</span> Dashboard</a>
        <a href="products.html"><span>📦</span> Products</a>
        <a href="orders.html"><span>🛒</span> Orders</a>
        <a href="users.html" class="active"><span>👥</span> Users</a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="../index.html"><span>🏠</span> Back to Store</a>
        <a href="#" onclick="logout()"><span>🚪</span> Logout</a>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Users</h1>
          <p>All registered accounts on your store.</p>
        </div>
      </div>

      <!-- ROLE TABS -->
      <div class="role-tabs" id="role-tabs">
        <!-- Filled by JS -->
      </div>

      <!-- SEARCH -->
      <div class="filter-bar">
        <input
          type="text"
          id="search-input"
          placeholder="Search by username or email..."
        />
      </div>

      <!-- USERS TABLE -->
      <div class="admin-panel">
        <div id="users-table-container">
          <!-- Filled by JS -->
        </div>
      </div>
    </main>

    <!-- USER DETAILS MODAL -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" style="max-width: 540px">
        <div id="modal-content"><!-- Filled by JS --></div>
      </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">Done!</div>
    <script src="../js/config.js"></script>
    <script>
    //   const API = "http://localhost:3000";

      // ---- AUTH ----
      const token = localStorage.getItem("token");
      const userStr = localStorage.getItem("user");
      if (!token || !userStr) window.location.href = "../login.html";
      const currentUser = JSON.parse(userStr);
      if (!currentUser.isAdmin) {
        alert("Access denied. Admin only.");
        window.location.href = "../index.html";
      }
      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "../index.html";
      }

      // ---- API HELPER ----
      async function apiFetch(path, options = {}) {
        const res = await fetch(`${API}${path}`, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
            ...(options.headers || {}),
          },
        });
        const data = res.status === 204 ? null : await res.json();
        if (!res.ok)
          throw new Error(
            (data && data.error) || `Request failed: ${res.status}`,
          );
        return data;
      }

      // ---- TOAST ----
      function showToast(message, type = "success") {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.className = `toast show ${type}`;
        setTimeout(() => toast.classList.remove("show"), 2500);
      }

      // ---- STATE ----
      let users = [];
      let currentRole = "all";
      let currentSearch = "";

      // ---- LOAD ----
      async function loadUsers() {
        try {
          users = await apiFetch("/admin/users");
          renderTabs();
          renderTable();
        } catch (error) {
          console.error(error);
          showToast(error.message, "error");
        }
      }

      // ---- TABS ----
      function renderTabs() {
        const total = users.length;
        const admins = users.filter((u) => u.isAdmin).length;
        const customers = total - admins;

        document.getElementById("role-tabs").innerHTML = `
                <button class="role-tab ${currentRole === "all" ? "active" : ""}" onclick="setRole('all')">
                    All <span class="count">${total}</span>
                </button>
                <button class="role-tab ${currentRole === "customers" ? "active" : ""}" onclick="setRole('customers')">
                    Customers <span class="count">${customers}</span>
                </button>
                <button class="role-tab ${currentRole === "admins" ? "active" : ""}" onclick="setRole('admins')">
                    Admins <span class="count">${admins}</span>
                </button>
            `;
      }

      function setRole(role) {
        currentRole = role;
        renderTabs();
        renderTable();
      }

      // ---- TABLE ----
      function renderTable() {
        const container = document.getElementById("users-table-container");
        let filtered = [...users];

        if (currentRole === "admins")
          filtered = filtered.filter((u) => u.isAdmin);
        if (currentRole === "customers")
          filtered = filtered.filter((u) => !u.isAdmin);

        if (currentSearch) {
          const q = currentSearch.toLowerCase();
          filtered = filtered.filter(
            (u) =>
              u.username.toLowerCase().includes(q) ||
              (u.email && u.email.toLowerCase().includes(q)),
          );
        }

        if (filtered.length === 0) {
          container.innerHTML = `<div class="empty-state-sm">No users match your filters.</div>`;
          return;
        }

        container.innerHTML = `
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Role</th>
                            <th>Orders</th>
                            <th>Total Spent</th>
                            <th>Joined</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtered
                          .map((u) => {
                            const isCurrentUser =
                              u.username === currentUser.username;
                            return `
                                <tr>
                                    <td>
                                        <div class="user-cell">
                                            <div class="user-avatar-sm ${u.isAdmin ? "admin" : ""}">${u.username.charAt(0).toUpperCase()}</div>
                                            <div>
                                                <strong>${u.username} ${isCurrentUser ? '<span style="color: var(--gold); font-size: 0.75rem;">(You)</span>' : ""}</strong>
                                                <span>${u.email || "No email"}</span>
                                            </div>
                                        </div>
                                    </td>
                                    <td><span class="role-pill ${u.isAdmin ? "admin" : "customer"}">${u.isAdmin ? "Admin" : "Customer"}</span></td>
                                    <td><strong>${u.ordersCount}</strong></td>
                                    <td><strong>₦${Number(u.totalSpent).toLocaleString()}</strong></td>
                                    <td>${formatDate(u.joinedAt)}</td>
                                    <td>
                                        <button class="icon-btn edit" title="View details" onclick="viewUser(${u.id})">👁️</button>
                                    </td>
                                </tr>
                            `;
                          })
                          .join("")}
                    </tbody>
                </table>
            `;
      }

      // ---- VIEW USER ----
      function viewUser(id) {
        const u = users.find((x) => x.id === id);
        if (!u) return;

        document.getElementById("modal-content").innerHTML = `
                <div class="user-profile-header">
                    <div class="user-avatar-lg ${u.isAdmin ? "admin" : ""}">${u.username.charAt(0).toUpperCase()}</div>
                    <div>
                        <h2>${u.username}</h2>
                        <p>${u.email || "No email on file"}</p>
                        <span class="role-pill ${u.isAdmin ? "admin" : "customer"}" style="margin-top: var(--s-2); display: inline-block;">${u.isAdmin ? "Admin" : "Customer"}</span>
                    </div>
                </div>

                <div class="stat-mini-grid">
                    <div class="stat-mini">
                        <div class="label">Total Orders</div>
                        <div class="value">${u.ordersCount}</div>
                    </div>
                    <div class="stat-mini">
                        <div class="label">Total Spent</div>
                        <div class="value">₦${Number(u.totalSpent).toLocaleString()}</div>
                    </div>
                </div>

                <div class="detail-section">
                    <h4>Account Info</h4>
                    <p><strong>User ID:</strong> #${u.id}</p>
                    <p><strong>Joined:</strong> ${formatDate(u.joinedAt, true)}</p>
                </div>

                <div class="modal-actions">
                    <button class="btn btn-primary" onclick="closeModal()">Close</button>
                </div>
            `;

        document.getElementById("modal-overlay").classList.add("active");
      }

      function closeModal() {
        document.getElementById("modal-overlay").classList.remove("active");
      }

      function formatDate(iso, withTime = false) {
        const d = new Date(iso);
        const opts = { day: "numeric", month: "short", year: "numeric" };
        if (withTime) {
          opts.hour = "2-digit";
          opts.minute = "2-digit";
        }
        return d.toLocaleDateString("en-NG", opts);
      }

      // ---- EVENTS ----
      document.getElementById("search-input").addEventListener("input", (e) => {
        currentSearch = e.target.value;
        renderTable();
      });
      document
        .getElementById("modal-overlay")
        .addEventListener("click", (e) => {
          if (e.target.id === "modal-overlay") closeModal();
        });

      // ---- INIT ----
      loadUsers();
    </script>
  </body>
</html>
